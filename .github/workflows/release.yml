name: Publish HM AppKit

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Validate release tag and notes
        run: |
          $release = ./scripts/Get-ReleaseMetadata.ps1 -Tag $env:GITHUB_REF_NAME
          if (-not (Test-Path -LiteralPath $release.NotesFile -PathType Leaf)) {
            throw "Missing exact-tag release notes: $($release.NotesFile)"
          }
          "HM_RELEASE_ROOT=$($release.RelativeOutputRoot)" >> $env:GITHUB_ENV
          "HM_RELEASE_NOTES=$($release.NotesFile)" >> $env:GITHUB_ENV
      - name: Test and build Windows x64 package
        run: ./scripts/Build.ps1
      - name: Verify package and SHA-256
        run: |
          $package = Join-Path $env:HM_RELEASE_ROOT 'HM-AppKit-win-x64.zip'
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $package).Path)
          try {
            $programs = @($archive.Entries | Where-Object FullName -match '\.(exe|msi)$' | ForEach-Object FullName)
            if ($programs.Count -ne 1 -or $programs[0] -ne 'HM AppKit.exe') {
              throw 'The release must contain only HM AppKit.exe, without vendor installers.'
            }
            if (@($archive.Entries | Where-Object FullName -match '(^|/)Local Installer/').Count -gt 0) {
              throw 'The installer cache must not be distributed.'
            }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = (Get-Content -LiteralPath ($package + '.sha256') -Raw).Trim()
          if ($checksum -ne "$hash  HM-AppKit-win-x64.zip") { throw 'Build checksum mismatch.' }
          Write-Output "SHA256: $hash"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'A published release already exists; it will not be overwritten.' }
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --title "HM AppKit $tag" --notes-file $env:HM_RELEASE_NOTES --draft
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the release draft.' }
          }
          $package = Join-Path $env:HM_RELEASE_ROOT 'HM-AppKit-win-x64.zip'
          gh release upload $tag $package ($package + '.sha256') --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload the release assets.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the release.' }
